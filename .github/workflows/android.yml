name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Verify APK package ID
      shell: bash
      run: |
        apk_path="app/build/outputs/apk/debug/app-debug.apk"
        aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
        package_name="$("$aapt_path" dump badging "$apk_path" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
        test "$package_name" = "com.aistudio.htmleditor.pzxjqw.v2"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: html-editor-app-debug-apk-v2
        path: app/build/outputs/apk/debug/app-debug.apk
